# Enable fully-featured C++
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Enable GNU-style static constructors
CONFIG_STATIC_INIT_GNU=y

# Test framework
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1

# Enable SPN system components
CONFIG_SPN_CORE=y
CONFIG_SPN_SYSTEM=y
CONFIG_SPN_LOGGING=y

# Enable fatal error handling
CONFIG_RUNTIME_ERROR_CHECKS=y