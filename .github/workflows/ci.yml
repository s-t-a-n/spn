name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIFEST_REPO: https://github.com/s-t-a-n/spn-workspace.git
  MANIFEST_REF: develop

jobs:
  setup-workspace:
    if: github.event.pull_request.draft == false
    name: Setup workspace
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/s-t-a-n/spn-ci:v0.1.0
    steps:
      - name: Checkout spn repository
        uses: actions/checkout@v4
        with:
          path: ws/spn

      - name: Clone workspace manifest
        working-directory: ws
        run: git clone --depth=1 -b ${{ env.MANIFEST_REF }} ${{ env.MANIFEST_REPO }} manifest

      - name: Cache Zephyr workspace
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ws/zephyr
            ws/modules
          key: zephyr-workspace-${{ runner.os }}-${{ hashFiles('ws/manifest/west.yml') }}
          restore-keys: |
            zephyr-workspace-${{ runner.os }}-

      - name: Initialize workspace
        working-directory: ws
        run: west init -l manifest

      - name: Update dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ws
        run: |
          west config manifest.project-filter -- '-spn'
          west update --narrow
          west config -d manifest.project-filter

      - name: Verify west commands available
        working-directory: ws
        run: west spn -h

      - name: Export workspace
        working-directory: ws
        run: west zephyr-export

      - name: Cache complete workspace
        uses: actions/cache/save@v4
        with:
          path: |
            ws/zephyr
            ws/modules
            ws/spn
            ws/manifest
            ws/.west
          key: workspace-${{ runner.os }}-${{ github.sha }}

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    needs: setup-workspace
    container:
      image: ghcr.io/s-t-a-n/spn-ci:v0.1.0
    steps:
      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            ws/zephyr
            ws/modules
            ws/spn
            ws/manifest
            ws/.west
          key: workspace-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run format check
        working-directory: ws/spn
        run: west spn format --check

  build-and-test:
    name: Build and test (${{ matrix.board }})
    runs-on: ubuntu-latest
    needs: setup-workspace
    container:
      image: ghcr.io/s-t-a-n/spn-ci:v0.1.0
    strategy:
      fail-fast: false
      #max-parallel: 1 # let twister do parallelization
      matrix:
        board:
          - native_sim
          - qemu_cortex_m3
          - qemu_cortex_a53/qemu_cortex_a53/smp
          - nrf52840dk/nrf52840
          - stm32f469i_disco
          - esp32_devkitc_wroom/esp32/procpu
    steps:
      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            ws/zephyr
            ws/modules
            ws/spn
            ws/manifest
            ws/.west
          key: workspace-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Build samples
        working-directory: ws/spn
        run: west spn build --board ${{ matrix.board }} --verbose

      - name: Run tests
        working-directory: ws/spn
        run: west spn test --board ${{ matrix.board }} --verbose

      - name: Sanitize board name for artifact
        if: failure()
        id: sanitize
        run: echo "board_safe=$(echo '${{ matrix.board }}' | tr '/' '_')" >> $GITHUB_OUTPUT

      - name: Upload build and test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ steps.sanitize.outputs.board_safe }}
          path: |
            ws/spn/build_samples/**/*.log
            ws/spn/build_tests/**/*.log
            ws/spn/twister-out/**/*.log
          retention-days: 7
          if-no-files-found: warn

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: setup-workspace
    container:
      image: ghcr.io/s-t-a-n/spn-ci:v0.1.0
    steps:
      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            ws/zephyr
            ws/modules
            ws/spn
            ws/manifest
            ws/.west
          key: workspace-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run clang-tidy
        working-directory: ws/spn
        run: west spn tidy

      - name: Run cppcheck
        working-directory: ws/spn
        run: west spn cppcheck

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [ setup-workspace, build-and-test ]
    container:
      image: ghcr.io/s-t-a-n/spn-ci:v0.1.0
    steps:
      - name: Restore workspace
        uses: actions/cache/restore@v4
        with:
          path: |
            ws/zephyr
            ws/modules
            ws/spn
            ws/manifest
            ws/.west
          key: workspace-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Generate coverage report
        working-directory: ws/spn
        run: west spn coverage
