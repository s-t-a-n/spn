name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: extract release notes
        id: release_notes
        run: |
          VERSION_NUMBER="${{ steps.version.outputs.version_number }}"
          if grep -q "## \[$VERSION_NUMBER\]" CHANGELOG.md; then
            sed -n "/## \[$VERSION_NUMBER\]/,/^## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          elif grep -q "## \[Unreleased\]" CHANGELOG.md; then
            {
              echo "Version $VERSION_NUMBER not found in CHANGELOG.md, using Unreleased section"
              echo
              sed -n "/## \[Unreleased\]/,/^## \[/p" CHANGELOG.md | sed '$d'
            } > release_notes.md
          else
            {
              echo "## Release ${{ steps.version.outputs.version }}"
              echo
              echo "See CHANGELOG.md for detailed changes."
            } > release_notes.md
          fi

      - name: create source archive
        run: |
          tar --exclude='.git*' \
              --exclude='build*' \
              --exclude='twister-out*' \
              --exclude='*.tar.*' \
              --exclude='*.zip' \
              -czf spn-module-${{ steps.version.outputs.version_number }}.tar.gz \
              .

      - name: create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          name: SPN Module ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: spn-module-${{ steps.version.outputs.version_number }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
